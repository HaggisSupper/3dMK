[workspace]
members = [
    "crates/vwm-core",
    "crates/vwm-io",
    "crates/vwm-geometry",
    "crates/vwm-perception",
    "crates/vwm-implicit-core",
    "crates/vwm-implicit-poisson",
    "crates/vwm-implicit-surface-nets",
    "crates/vwm-implicit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
log = "0.4"
rayon = "1.10"
ahash = "0.8"
smallvec = "1.13"
