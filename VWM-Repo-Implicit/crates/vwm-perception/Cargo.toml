[package]
name = "vwm-perception"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ml-tract", "vlm-http"]
ml-tract = ["dep:tract-onnx"]
vlm-http = ["dep:reqwest", "dep:base64"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
nalgebra.workspace = true
vwm-core = { path = "../vwm-core" }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
tract-onnx = { version = "0.23.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
approx = "0.5"
