name: OpenCode Big Pickle

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Instruction for the 3DMk VWM coding agent
        required: false
        default: >-
          Execute the next dependency-ready task in the authoritative VWM implementation plan.
          Follow AGENTS.md, use TDD, run the independent reviewer and verifier, update the
          progress ledger with command evidence, and open or update a pull request. Do not
          reduce scope or claim completion without the required gates.
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-big-pickle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  comment-request:
    name: Authorized comment request
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Acknowledge authorized request
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            };
            if (context.eventName === 'pull_request_review_comment') {
              await github.rest.reactions.createForPullRequestReviewComment(params);
            } else {
              await github.rest.reactions.createForIssueComment(params);
            }

      - name: Detect OpenCode Zen API key
        id: key-check
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "${OPENCODE_API_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing OpenCode Zen API key
        if: steps.key-check.outputs.available != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'OpenCode request could not start because repository Actions secret OPENCODE_API_KEY is missing. Add the OpenCode Zen API key under Settings → Secrets and variables → Actions, then submit the command again.'
            });

      - name: Fail closed without OpenCode Zen API key
        if: steps.key-check.outputs.available != 'true'
        shell: bash
        run: |
          echo "::error::Missing repository Actions secret OPENCODE_API_KEY."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode with Big Pickle
        id: opencode
        uses: anomalyco/opencode/github@v1.18.7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          agent: vwm-executor
          share: false
          use_github_token: true
          mentions: /opencode,/oc

      - name: Report OpenCode workflow failure
        if: failure() && steps.key-check.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `OpenCode Big Pickle started but the workflow failed. Inspect the Actions run: ${runUrl}`
            });

      - name: Mark request complete
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            };
            if (context.eventName === 'pull_request_review_comment') {
              await github.rest.reactions.createForPullRequestReviewComment(params);
            } else {
              await github.rest.reactions.createForIssueComment(params);
            }

  manual-request:
    name: Manual implementation request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require OpenCode Zen API key
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret OPENCODE_API_KEY. Add an OpenCode Zen API key before dispatching this workflow."
            exit 1
          fi

      - name: Run OpenCode with Big Pickle
        uses: anomalyco/opencode/github@v1.18.7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          agent: vwm-executor
          share: false
          use_github_token: true
          prompt: ${{ inputs.prompt }}
