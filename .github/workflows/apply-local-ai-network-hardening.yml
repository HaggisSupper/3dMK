name: Apply Local AI Network Hardening

on:
  push:
    branches:
      - agent/spatial-vwm-feature-integration

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply local-only AI network and resource contracts
        shell: pwsh
        run: |
          $path = 'src/ai_vision.rs'
          $content = Get-Content -LiteralPath $path -Raw

          $helperAnchor = @'
fn local_vlm_completion_url(endpoint: &str) -> Result<String> {
'@
          $helper = @'
fn validate_local_ai_image_budget(bytes: &[u8]) -> Result<(u32, u32)> {
    if bytes.len() > crate::perception::MAX_VWM_PERCEPTION_IMAGE_BYTES {
        anyhow::bail!("Local AI image exceeds the compressed-byte budget");
    }
    let reader = image::ImageReader::new(std::io::Cursor::new(bytes))
        .with_guessed_format()
        .context("Local AI could not determine the supplied image format")?;
    let (width, height) = reader
        .into_dimensions()
        .context("Local AI could not read the supplied image dimensions")?;
    let pixels = u64::from(width)
        .checked_mul(u64::from(height))
        .context("Local AI image dimensions overflow")?;
    if width == 0 || height == 0 || pixels > crate::perception::MAX_VWM_PERCEPTION_PIXELS {
        anyhow::bail!("Local AI image exceeds the decoded-pixel budget");
    }
    Ok((width, height))
}

fn local_vlm_completion_url(endpoint: &str) -> Result<String> {
'@
          if (-not $content.Contains('fn validate_local_ai_image_budget', [StringComparison]::Ordinal)) {
            if (-not $content.Contains($helperAnchor, [StringComparison]::Ordinal)) {
              throw 'Local VLM URL helper anchor is missing.'
            }
            $content = $content.Replace($helperAnchor, $helper)
          }

          $decodeOld = @'
    let decoded = image::load_from_memory(image_bytes)
        .context("VLM object detection could not decode the supplied image")?;
    let (image_width, image_height) = (decoded.width(), decoded.height());
'@
          $decodeNew = @'
    let (image_width, image_height) = validate_local_ai_image_budget(image_bytes)?;
    let decoded = image::load_from_memory(image_bytes)
        .context("VLM object detection could not decode the supplied image")?;
    if decoded.width() != image_width || decoded.height() != image_height {
        anyhow::bail!("Local AI image dimensions changed during decode");
    }
'@
          if ($content.Contains($decodeOld, [StringComparison]::Ordinal)) {
            $content = $content.Replace($decodeOld, $decodeNew)
          } elseif (-not $content.Contains('validate_local_ai_image_budget(image_bytes)?', [StringComparison]::Ordinal)) {
            throw 'VLM decode budget anchor is missing.'
          }

          $floorplanOld = @'
    let image_bytes = std::fs::read(path)
        .with_context(|| format!("Failed to read image file: {}", path.display()))?;
'@
          $floorplanNew = @'
    let image_bytes = std::fs::read(path)
        .with_context(|| format!("Failed to read image file: {}", path.display()))?;
    validate_local_ai_image_budget(&image_bytes)?;
'@
          if ($content.Contains($floorplanOld, [StringComparison]::Ordinal)) {
            $content = $content.Replace($floorplanOld, $floorplanNew)
          } elseif (-not $content.Contains('validate_local_ai_image_budget(&image_bytes)?;', [StringComparison]::Ordinal)) {
            throw 'Floorplan image budget anchor is missing.'
          }

          $content = $content.Replace(
            'let client = reqwest::Client::builder()`n        .timeout',
            'let client = reqwest::Client::builder()`n        .redirect(reqwest::redirect::Policy::none())`n        .timeout'
          )
          $content = $content.Replace(
            'let client = match reqwest::Client::builder()`n        .timeout',
            'let client = match reqwest::Client::builder()`n        .redirect(reqwest::redirect::Policy::none())`n        .timeout'
          )
          $content = $content.Replace(
            'let response = reqwest::Client::builder()`n        .timeout',
            'let response = reqwest::Client::builder()`n        .redirect(reqwest::redirect::Policy::none())`n        .timeout'
          )
          if (([regex]::Matches($content, 'redirect\(reqwest::redirect::Policy::none\(\)\)')).Count -lt 3) {
            throw 'Every local AI HTTP client must disable redirects.'
          }

          $testAnchor = @'
    #[test]
    fn mistral_endpoint_origin_is_loopback_only() {
'@
          $test = @'
    #[test]
    fn local_ai_image_budget_rejects_oversized_payloads() {
        let oversized = vec![0_u8; crate::perception::MAX_VWM_PERCEPTION_IMAGE_BYTES + 1];
        let error = validate_local_ai_image_budget(&oversized)
            .unwrap_err()
            .to_string();
        assert!(error.contains("compressed-byte budget"));
    }

    #[test]
    fn mistral_endpoint_origin_is_loopback_only() {
'@
          if (-not $content.Contains('local_ai_image_budget_rejects_oversized_payloads', [StringComparison]::Ordinal)) {
            if (-not $content.Contains($testAnchor, [StringComparison]::Ordinal)) {
              throw 'AI vision test anchor is missing.'
            }
            $content = $content.Replace($testAnchor, $test)
          }

          Set-Content -LiteralPath $path -Value $content -Encoding utf8 -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "rustfmt failed with exit code $LASTEXITCODE" }
          cargo test --locked local_ai_image_budget_rejects_oversized_payloads -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Local AI image budget test failed with exit code $LASTEXITCODE" }
          cargo test --locked mistral_endpoint_origin_is_loopback_only -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Local AI origin test failed with exit code $LASTEXITCODE" }

      - name: Commit hardening when required
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3).Replace('\', '/') })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/ai_vision.rs') {
            throw "Unexpected hardening changes: $($changed -join ', ')"
          }
          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- src/ai_vision.rs
          git commit -m 'fix: prevent local AI redirects and decompression abuse'
          if ($LASTEXITCODE -ne 0) { throw "Commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Push failed with exit code $LASTEXITCODE" }
