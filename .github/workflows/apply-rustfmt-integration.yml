name: Apply Rustfmt to Integration Branch

on:
  push:
    branches:
      - agent/spatial-vwm-feature-integration

permissions:
  contents: write

concurrency:
  group: rustfmt-spatial-vwm-feature-integration
  cancel-in-progress: false

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical formatting
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "Root rustfmt failed with exit code $LASTEXITCODE" }
          cargo fmt --all --manifest-path VWM-Repo-Implicit/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "VWM rustfmt failed with exit code $LASTEXITCODE" }

      - name: Commit formatting only when required
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) {
            Write-Host 'Rust formatting already canonical.'
            exit 0
          }

          $unexpected = @($changes | Where-Object { $_ -notmatch '\.rs$' })
          if ($unexpected.Count -gt 0) {
            throw "rustfmt changed non-Rust files:`n$($unexpected -join [Environment]::NewLine)"
          }

          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply canonical rustfmt [rustfmt-applied]'
          if ($LASTEXITCODE -ne 0) { throw "Formatting commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Formatting push failed with exit code $LASTEXITCODE" }
