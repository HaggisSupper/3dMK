name: Copilot Development Instructions

on:
  push:
    branches:
      - main
    paths:
      - .github/DEV_INSTRUCTIONS.md
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-dev-instructions
  cancel-in-progress: false

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Build reviewed task delta
        id: delta
        shell: bash
        env:
          EVENT_NAME: \${{ github.event_name }}
          BEFORE_SHA: \${{ github.event.before }}
          CURRENT_SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          delta_file=.github/DEV_INSTRUCTIONS.delta

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git show "$CURRENT_SHA:.github/DEV_INSTRUCTIONS.md" > "$delta_file"
          else
            git diff --no-ext-diff --unified=80 "$BEFORE_SHA" "$CURRENT_SHA" -- .github/DEV_INSTRUCTIONS.md > "$delta_file"
          fi

          test -s "$delta_file"
          echo "delta_file=$delta_file" >> "$GITHUB_OUTPUT"

      - name: Assign delta to Copilot cloud agent
        env:
          GH_TOKEN: \${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: \${{ github.repository }}
          COMMIT_SHA: \${{ github.sha }}
          DELTA_FILE: \${{ steps.delta.outputs.delta_file }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "\${GH_TOKEN:-}" ]]; then
            echo "::error::COPILOT_AGENT_TOKEN is not configured."
            exit 1
          fi

          marker="<!-- dev-instructions-commit:$COMMIT_SHA -->"
          if gh issue list --repo "$REPOSITORY" --state all --search "$marker in:body" --json number --jq 'length' | grep -q '^1$'; then
            echo "An issue already exists for $COMMIT_SHA."
            exit 0
          fi

          delta="$(cat "$DELTA_FILE")"
          instructions="$(cat .github/copilot-instructions.md)"
          body="$(jq -n \
            --arg marker "$marker" \
            --arg sha "$COMMIT_SHA" \
            --arg delta "$delta" \
            --arg instructions "$instructions" \
            '$marker + "\n\nAutomated task generated from .github/DEV_INSTRUCTIONS.md at commit " + $sha + ".\n\n## Instructions delta\n\n    " + ($delta | gsub("\n"; "\n    ")) + "\n\n## Repository instructions\n\n" + $instructions')"

          jq -n \
            --arg title "[Copilot] Apply development-instructions delta $COMMIT_SHA" \
            --arg body "$body" \
            --arg target_repo "$REPOSITORY" \
            '{title:$title, body:$body, assignees:["copilot-swe-agent[bot]"], agent_assignment:{target_repo:$target_repo, base_branch:"main", custom_instructions:"Implement only the instructions delta in this issue. Open a draft pull request and include test evidence.", custom_agent:"", model:""}}' > issue.json

          gh api \
            --method POST \
            --repo "$REPOSITORY" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/"$REPOSITORY"/issues \
            --input issue.json
