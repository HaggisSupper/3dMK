name: Apply Spatial VWM Final Hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - agent/spatial-vwm-feature-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-vwm-final-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/spatial-vwm-feature-integration' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply bounded final hardening
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/apply-spatial-vwm-source-repair.ps1

      - name: Commit hardened production files when required
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) {
            Write-Host 'Final hardening is already applied.'
            exit 0
          }
          $allowed = @(
            'public/index.html',
            'src/api.rs',
            'src/ai_vision.rs',
            'src/perception.rs',
            'tests/vwm_advanced_ui.rs'
          )
          $changedPaths = @($changes | ForEach-Object { $_.Substring(3).Replace('\', '/') })
          $unexpected = @($changedPaths | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Final hardening changed files outside the approved boundary:`n$($unexpected -join [Environment]::NewLine)"
          }

          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- @($allowed)
          git commit -m 'fix: confine local AI and bound perception resources [final-hardening-applied]'
          if ($LASTEXITCODE -ne 0) { throw "Final hardening commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Final hardening push failed with exit code $LASTEXITCODE" }
