name: Apply Spatial VWM Integration Repair

on:
  push:
    branches:
      - agent/spatial-vwm-feature-integration

permissions:
  contents: write

concurrency:
  group: spatial-vwm-integration-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[integration-repair-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and verify bounded repair
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File scripts/repair-spatial-vwm-integration.ps1

      - name: Commit repaired production files
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) {
            throw 'The repair workflow produced no tracked changes.'
          }
          $allowed = @('src/api.rs', 'src/ai_vision.rs')
          $changedPaths = @($changes | ForEach-Object { $_.Substring(3).Replace('\', '/') })
          $unexpected = @($changedPaths | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Repair changed files outside the approved boundary:`n$($unexpected -join [Environment]::NewLine)"
          }

          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- src/api.rs src/ai_vision.rs
          git commit -m 'fix: preserve import support and confine VLM to loopback [integration-repair-applied]'
          if ($LASTEXITCODE -ne 0) { throw "Repair commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Repair push failed with exit code $LASTEXITCODE" }
