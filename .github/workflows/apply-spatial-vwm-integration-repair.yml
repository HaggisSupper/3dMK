name: Apply Spatial VWM Source Repair

on:
  push:
    branches:
      - agent/spatial-vwm-feature-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-vwm-source-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply bounded source repair
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/apply-spatial-vwm-source-repair.ps1

      - name: Commit repaired production files when required
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -eq 0) {
            Write-Host 'Source repair is already applied.'
            exit 0
          }
          $allowed = @(
            'src/api.rs',
            'src/ai_vision.rs',
            'src/packages.rs',
            'src/point_cloud.rs',
            'src/scene.rs'
          )
          $changedPaths = @($changes | ForEach-Object { $_.Substring(3).Replace('\', '/') })
          $unexpected = @($changedPaths | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Source repair changed files outside the approved boundary:`n$($unexpected -join [Environment]::NewLine)"
          }

          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- @($allowed)
          git commit -m 'fix: harden advanced spatial and VWM integration [source-repair-applied]'
          if ($LASTEXITCODE -ne 0) { throw "Source repair commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Source repair push failed with exit code $LASTEXITCODE" }
