name: Apply Current-State Admission Wording

on:
  push:
    branches:
      - agent/spatial-vwm-feature-integration

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-vwm-feature-integration
          fetch-depth: 0

      - name: Apply exact contract wording
        shell: pwsh
        run: |
          $path = 'docs/CURRENT_STATE.md'
          $content = Get-Content -LiteralPath $path -Raw
          $old = 'safely fast-forwards a strictly behind implementation branch'
          $new = 'fast-forwards the branch when it is strictly behind'
          if ($content.Contains($new, [StringComparison]::Ordinal)) {
            Write-Host 'Current-state wording is already canonical.'
            exit 0
          }
          if (-not $content.Contains($old, [StringComparison]::Ordinal)) {
            throw 'The expected current-state branch-admission wording was not found.'
          }
          $content = $content.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $content -Encoding utf8 -NoNewline

      - name: Commit the wording correction when required
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            exit 0
          }
          git config user.name '3DMk CI'
          git config user.email '3dmk-ci@users.noreply.github.com'
          git add -- docs/CURRENT_STATE.md
          git commit -m 'docs: align current-state mainline admission contract'
          if ($LASTEXITCODE -ne 0) { throw "Commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/spatial-vwm-feature-integration
          if ($LASTEXITCODE -ne 0) { throw "Push failed with exit code $LASTEXITCODE" }
