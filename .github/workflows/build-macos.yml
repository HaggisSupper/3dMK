name: Build 3DMk macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos-universal:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build universal macOS app and DMG
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg
        working-directory: src-tauri

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3DMk-macOS-universal
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
