[package]
name = "agentic-cad-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.32", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs"] }
# Truck CAD Kernel dependencies
truck-modeling = "0.6"
truck-topology = "0.6"
truck-stepio = "0.3"
vwm-core = { path = "VWM-Repo-Implicit/crates/vwm-core" }
vwm-io = { path = "VWM-Repo-Implicit/crates/vwm-io" }
vwm-geometry = { path = "VWM-Repo-Implicit/crates/vwm-geometry" }
vwm-implicit = { path = "VWM-Repo-Implicit/crates/vwm-implicit" }
vwm-perception = { path = "VWM-Repo-Implicit/crates/vwm-perception", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
